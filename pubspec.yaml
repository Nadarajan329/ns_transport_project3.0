name: ns_transport
description: "NS Transport Management System - Professional transport management app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Supabase
  supabase_flutter: ^2.8.4

  # Authentication
  google_sign_in: ^6.2.2

  # Local Storage
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Utilities
  image_picker: ^1.1.2
  pdf: ^3.11.2
  printing: ^5.13.5
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo.png
